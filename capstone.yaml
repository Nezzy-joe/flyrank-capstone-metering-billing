# Submission manifest the evaluator reads.
run: docker compose up --build                 # postgres -> one-shot migrate -> api
seed: docker compose run --rm api /app/seed    # prints a demo tenant + API key (once)
test: go test ./...                            # unit; `make test-integration` adds DB tests
base_url: http://localhost:8080
endpoints:
  - GET  /health
  - GET  /ready
  - POST /v1/generate
  - GET  /v1/usage
  - POST /v1/checkout
  - POST /webhooks/stripe
