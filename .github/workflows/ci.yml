name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres so the integration tests run in CI, not just the offline
    # unit tests. The service is health-checked before any step uses it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # cmd/migrate reads DATABASE_URL; the service integration tests read
      # TEST_DATABASE_URL. Both point at the health-checked Postgres service.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/metering_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/metering_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Apply migrations
        run: go run ./cmd/migrate up

      - name: Test (unit + integration)
        run: go test -race ./...
